<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мои идеи проектов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-glow bg-glow--second"></div>

  <main class="app">
    <header class="app__header">
      <h1 class="app__title">Мои идеи проектов</h1>
      <p class="app__subtitle">Записывай идеи по дороге — отмечай выполненные.</p>
    </header>

    <section class="card input-card">
      <div class="input-wrapper">
        <input
          id="taskInput"
          type="text"
          placeholder="Например: сделать приложение для отслеживания привычек..."
          autocomplete="off"
        />
        <button id="addBtn" class="btn btn--primary" aria-label="Добавить">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
    </section>

    <section class="card stats-card">
      <div class="stat">
        <span class="stat__value" id="totalCount">0</span>
        <span class="stat__label">Всего</span>
      </div>
      <div class="stat">
        <span class="stat__value" id="activeCount">0</span>
        <span class="stat__label">Активные</span>
      </div>
      <div class="stat">
        <span class="stat__value" id="doneCount">0</span>
        <span class="stat__label">Выполнено</span>
      </div>
    </section>

    <section class="card filters">
      <button class="filter is-active" data-filter="all">Все</button>
      <button class="filter" data-filter="active">Активные</button>
      <button class="filter" data-filter="completed">Выполненные</button>
    </section>

    <section class="card list-card">
      <ul id="taskList" class="task-list"></ul>
      <div id="emptyState" class="empty-state">
        <div class="empty-state__icon">💡</div>
        <p class="empty-state__text">Пока идей нет. Добавь первую сверху!</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
